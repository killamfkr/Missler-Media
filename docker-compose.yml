# Missler Media Photography — no .env file required.
# Edit the values under `web.environment` below, then run:
#   docker compose pull && docker compose up -d
#
# Download only this file (no git clone):
#   curl -fsSL -o docker-compose.yml \
#     https://raw.githubusercontent.com/killamfkr/Missler-Media/cursor/missler-media-photography-827c/docker-compose.yml

services:
  # SQLite sidecar — owns the persistent database volume.
  # SQLite is file-based (not a network server); this container keeps /data alive.
  sqlite:
    image: alpine:3.21
    container_name: missler-sqlite
    volumes:
      - sqlite_data:/data
    command:
      - sh
      - -c
      - |
        mkdir -p /data
        touch /data/missler.db
        chmod 777 /data
        echo "SQLite volume ready at /data/missler.db"
        exec sleep infinity
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "test", "-f", "/data/missler.db"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    image: ghcr.io/killamfkr/missler-media:latest
    container_name: missler-web
    depends_on:
      sqlite:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - sqlite_data:/data
    environment:
      # ── Required ──────────────────────────────────────────────
      AUTH_SECRET: "change-this-to-a-long-random-secret"
      DATABASE_URL: "file:/data/missler.db"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      GOOGLE_REDIRECT_URI: "http://localhost:3000/api/google/callback"

      # ── Stripe (optional) ─────────────────────────────────────
      STRIPE_SECRET_KEY: ""
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ""

      # ── PayPal (optional) ─────────────────────────────────────
      NEXT_PUBLIC_PAYPAL_CLIENT_ID: ""
      PAYPAL_CLIENT_SECRET: ""

      # ── Google Photos (optional) ──────────────────────────────
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
    restart: unless-stopped

volumes:
  sqlite_data:
